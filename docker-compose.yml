x-rocky: &rocky
  build: .
  image: rocky:dev
  environment: &rocky-env
    ROCKY_DATABASE_URL: postgres://rocky:rocky@postgres:5432/rocky?sslmode=disable

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rocky
      POSTGRES_PASSWORD: rocky # local dev only
      POSTGRES_DB: rocky
    ports: ["5432:5432"]
    volumes: [pgdata18:/var/lib/postgresql] # PG18 layout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rocky -d rocky"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *rocky
    entrypoint: ["migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *rocky
    entrypoint: ["api"]
    environment:
      <<: *rocky-env
      ROCKY_REDIS_URL: redis://redis:6379/0
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started } # not required for correctness (ADR 0002)
    restart: unless-stopped

  worker:
    <<: *rocky
    entrypoint: ["worker"]
    environment:
      <<: *rocky-env
      ROCKY_WORKER_LEASE_TTL: 10s # short, so crash recovery is quick to observe locally
      ROCKY_SHUTDOWN_TIMEOUT: 10s # drain grace period
    stop_grace_period: 30s # must exceed grace + one lease TTL, or Docker kills a draining worker
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata18:
