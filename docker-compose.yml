services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rocky
      POSTGRES_PASSWORD: rocky # local dev only
      POSTGRES_DB: rocky
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rocky -d rocky"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      ROCKY_DATABASE_URL: postgres://rocky:rocky@postgres:5432/rocky?sslmode=disable
      ROCKY_REDIS_URL: redis://redis:6379/0
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started } # not required for correctness (ADR 0002)
    restart: unless-stopped

volumes:
  pgdata:
